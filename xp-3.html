<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diffusion stochastique adaptative v2</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    z-index: -1;
  }
  .content {
    position: relative;
    z-index: 1;
    max-width: 60ch;
    margin: 10vh auto;
    padding: 2rem;
    font-family: system-ui, sans-serif;
    line-height: 1.6;
    transition: color 0.4s, background 0.4s;
  }
  body.light {
    background: #fefefe;
    color: #1a1a1a;
  }
  body.dark {
    background: #0b0b0e;
    color: #f2f2f2;
  }
  .theme-toggle {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 5;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 9999px;
    padding: 0.4rem 0.8rem;
    font-size: 0.9rem;
    cursor: pointer;
    backdrop-filter: blur(6px);
    color: inherit;
  }
  .theme-toggle:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>
  <div class="content">
    <h1>Fond vivant et lisible</h1>
    <p>
      En mode clair, une poussière légère flotte doucement comme dans un rayon de lumière.  
      En mode sombre, les étoiles s’écartent du centre et reviennent lentement.
    </p>
  </div>

  <button class="theme-toggle" id="toggleTheme">🌓</button>

  <script>
    let particles = [];
    let center;
    let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.body.classList.add(theme);

    function setup() {
      createCanvas(windowWidth, windowHeight);
      pixelDensity(1);
      center = createVector(width / 2, height / 2);
      initParticles();
      noStroke();
    }

    function initParticles() {
      particles = [];
      const n = theme === 'dark' ? 350 : 600;
      for (let i = 0; i < n; i++) {
        particles.push({
          x: random(width),
          y: random(height),
          vx: random(-0.15, 0.15),
          vy: random(-0.15, 0.15),
          baseAlpha: random(0.4, 1),
          size: random(theme === 'dark' ? 0.6 : 0.8, theme === 'dark' ? 1.8 : 2.8)
        });
      }
    }

    function draw() {
      background(theme === 'dark' ? 10 : 254);

      const target = createVector(mouseX || width / 2, mouseY || height / 2);
      center.lerp(target, 0.05);

      for (let p of particles) {
        const dx = p.x - center.x;
        const dy = p.y - center.y;
        const dist2 = dx * dx + dy * dy;
        const r = sqrt(dist2);
        const calmRadius = theme === 'dark' ? 180 : 220;
        const repel = r < calmRadius ? (calmRadius - r) / calmRadius : 0;

        if (repel > 0) {
          p.vx += (dx / r) * repel * 0.008;
          p.vy += (dy / r) * repel * 0.008;
        }

        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy *= 0.97;

        if (p.x < 0) p.x += width;
        if (p.x > width) p.x -= width;
        if (p.y < 0) p.y += height;
        if (p.y > height) p.y -= height;

        const fade = smoothstep(0, calmRadius, r);
        const alpha = p.baseAlpha * (theme === 'dark' ? 255 : 180) * fade;
        const col = theme === 'dark'
          ? color(255, 255, 255, alpha * 0.8)
          : color(0, 0, 0, alpha * 0.08);

        fill(col);
        ellipse(p.x, p.y, p.size);
      }
    }

    function smoothstep(edge0, edge1, x) {
      let t = constrain((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      initParticles();
    }

    const btn = document.getElementById('toggleTheme');
    btn.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      document.body.classList.remove('light', 'dark');
      document.body.classList.add(theme);
      initParticles();
    });

    function touchMoved() {
      center.x = lerp(center.x, touches[0].x, 0.05);
      center.y = lerp(center.y, touches[0].y, 0.05);
      return false;
    }
  </script>
</body>
</html>
