<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fond biomimétique – vie apaisée</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<style>
  html, body { margin:0; padding:0; overflow:hidden; }
  canvas { position:fixed; inset:0; z-index:-1; }
  .content {
    position:relative; z-index:1; max-width:60ch;
    margin:10vh auto; padding:2rem;
    font-family:system-ui,sans-serif; line-height:1.6;
    transition:color .4s,background .4s;
  }
  body.light { background:#fbfbfb; color:#181818; }
  body.dark { background:#05060a; color:#f4f4f4; }
  .theme-toggle {
    position:fixed; right:1rem; bottom:1rem; z-index:5;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.25);
    border-radius:9999px; padding:.4rem .9rem;
    font-size:.9rem; cursor:pointer; backdrop-filter:blur(6px);
    color:inherit;
  }
</style>
</head>
<body>
  <div class="content">
    <h1>Fond biomimétique apaisé</h1>
    <p>
      Le mode clair reste vivant en permanence&nbsp;: les lignes respirent lentement,
      se fragmentent et se reforment avec douceur. Lors d’une interaction, la scène
      s’anime légèrement puis retrouve son calme.
    </p>
  </div>
  <button class="theme-toggle" id="toggleTheme">🌓</button>

  <script>
    let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.body.classList.add(theme);
    let center, lastInteraction=0;
    let stars=[], filaments=[];
    const ACTIVE_RATIO=0.2;

    function setup(){
      createCanvas(windowWidth,windowHeight);
      pixelDensity(1);
      center=createVector(width/2,height/2);
      initMode();
      window.addEventListener('scroll',()=>lastInteraction=millis(),{passive:true});
      lastInteraction=millis();
      strokeCap(ROUND);
    }

    function initMode(){
      if(theme==='dark') initDark(); else initLight();
    }

    /* --- DARK --- */
    function initDark(){
      stars=[];
      for(let i=0;i<380;i++){
        stars.push({
          x:random(width),y:random(height),
          vx:random(-0.2,0.2),vy:random(-0.2,0.2),
          baseAlpha:random(0.4,1),phase:random(TWO_PI),
          size:random(0.7,2.3),isFast:random()<0.12
        });
      }
    }
    function drawDark(){
      background(7,90);
      const calmR=190;
      const target=createVector(
        (mouseX>=0&&mouseX<=width)?mouseX:width/2,
        (mouseY>=0&&mouseY<=height)?mouseY:height/2);
      center.lerp(target,0.06);
      noStroke();
      for(const p of stars){
        const dx=p.x-center.x,dy=p.y-center.y,r=sqrt(dx*dx+dy*dy)||1;
        if(r<calmR){const f=(calmR-r)/calmR*(p.isFast?0.016:0.010);
          p.vx+=dx/r*f;p.vy+=dy/r*f;}
        const n=noise(p.x*0.002,p.y*0.002,frameCount*0.002);
        const turb=(n-0.5)*(p.isFast?0.025:0.012);
        p.vx+=turb;p.vy+=turb*0.5;
        p.x+=p.vx;p.y+=p.vy;
        p.vx*=p.isFast?0.988:0.982;p.vy*=p.isFast?0.988:0.982;
        if(p.x<0)p.x+=width;if(p.x>width)p.x-=width;
        if(p.y<0)p.y+=height;if(p.y>height)p.y-=height;
        const flick=0.6+0.4*sin(frameCount*(p.isFast?0.05:0.03)+p.phase);
        const fade=constrain(r/calmR,0,1);
        const a=p.baseAlpha*flick*(1-fade);
        fill(255,255,255,a*255);ellipse(p.x,p.y,p.size);
      }
    }

    /* --- LIGHT --- */
    function initLight(){
      filaments=[];
      const N=200, minD=min(width,height);
      const calm=minD*0.45;
      for(let i=0;i<N;i++){
        let x,y,r; do{x=random(width);y=random(height);r=dist(x,y,width/2,height/2);}while(r<calm*0.8);
        const active=i<N*ACTIVE_RATIO;
        filaments.push({
          x,y,angle:random(TWO_PI),
          len:active?random(20,35):random(10,25),
          segs:int(random(2,5)),
          phase:random(TWO_PI),
          life:random(1000),
          isActive:active,
          speed:active?random(0.3,0.6):random(0.03,0.15),
          intensity:random(0.5,1)
        });
      }
    }

    function drawLight(){
      const minD=min(width,height);
      const idle=constrain((millis()-lastInteraction)/8000,0,1);
      const calmR=lerp(minD*0.4,minD*0.65,idle);
      const target=(idle<0.6)?createVector(mouseX,mouseY):createVector(width/2,height/2);
      center.lerp(target,0.05);
      background(251);

      for(let f of filaments){
        const dx=f.x-center.x,dy=f.y-center.y,r=sqrt(dx*dx+dy*dy)||1;
        if(r<calmR){const push=(calmR-r)/calmR;f.x+=dx/r*push*0.4;f.y+=dy/r*push*0.4;}

        // oscillation douce + mouvement organique
        const n=noise(f.x*0.0015,f.y*0.0015,frameCount*0.002+f.life);
        f.angle+=map(n,0,1,-0.02,0.02);
        const moveAmp=f.speed*(0.4+0.6*(1-idle*0.7));
        f.x+=cos(f.angle)*moveAmp;
        f.y+=sin(f.angle)*moveAmp;

        // fragmentation / regroupement
        const frag=noise(f.life*0.001+frameCount*0.002);
        const fragFactor=map(frag,0,1,0.3,1);
        const segCount=int(map(fragFactor,0.3,1,4,2));
        f.segs=segCount;
        const len=f.len*fragFactor;
        f.len=lerp(f.len,len,0.05);

        // pulsation d’intensité (vie permanente)
        f.intensity=lerp(f.intensity,0.5+0.5*sin(frameCount*0.01+f.phase)*(1-idle*0.5),0.05);

        if(f.x<0)f.x+=width;if(f.x>width)f.x-=width;
        if(f.y<0)f.y+=height;if(f.y>height)f.y-=height;

        const distFactor=smoothstep(calmR*0.9,max(width,height)*0.75,r);
        const baseAlpha=f.isActive?map(distFactor,0,1,50,150):map(distFactor,0,1,25,90);
        const alpha=baseAlpha*f.intensity;
        stroke(0,alpha);
        strokeWeight(f.isActive?0.9:0.6);

        // segments
        const dirX=cos(f.angle),dirY=sin(f.angle);
        const segLen=f.len/f.segs;
        for(let i=0;i<f.segs;i++){
          const off=(i-f.segs/2)*segLen*1.2;
          const x1=f.x+dirX*off, y1=f.y+dirY*off;
          const x2=x1+dirX*segLen*0.8, y2=y1+dirY*segLen*0.8;
          line(x1,y1,x2,y2);
        }
        f.life+=1;
      }
    }

    function draw(){
      if(theme==='dark') drawDark(); else drawLight();
    }

    function smoothstep(e0,e1,x){let t=constrain((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);}
    function windowResized(){resizeCanvas(windowWidth,windowHeight);center.set(width/2,height/2);initMode();}
    function mouseMoved(){lastInteraction=millis();}
    function mousePressed(){lastInteraction=millis();}
    function touchStarted(){lastInteraction=millis();}
    function touchMoved(){lastInteraction=millis();}
    document.getElementById('toggleTheme').addEventListener('click',()=>{
      theme=(theme==='dark')?'light':'dark';
      document.body.classList.toggle('dark');document.body.classList.toggle('light');
      initMode();lastInteraction=millis();
    });
  </script>
</body>
</html>
